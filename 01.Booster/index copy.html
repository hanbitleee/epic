    <script>
        // NOTE: This is the user's original, buggy script, replicated for debugging.
        document.addEventListener('DOMContentLoaded', () => {
            const viewport = document.querySelector('.slides-viewport');
            const slidesContainer = document.querySelector('.slides-container');
            
            const positionText = document.getElementById('positionText');
            const timelineIndicator = document.getElementById('slidePosition');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const playPauseBtnDesktop = document.getElementById('playPauseBtnDesktop');

            const positionTextMobile = document.getElementById('positionTextMobile');
            const timelineIndicatorMobile = document.getElementById('slidePositionMobile');
            const playPauseBtnMobile = document.getElementById('playPauseBtnMobile');


            const slideData = [
                {
                    imageDesktop: 'https://placehold.co/1600x640/3498db/ffffff?text=Desktop+1',
                    imageMobile: 'https://placehold.co/540x540/3498db/ffffff?text=Mobile+1',
                    title: '우리 아이 영어 부스트업',
                    subtitle: '<span style="background: linear-gradient(90deg, #AB35CF, #ff8587); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">2025 에픽 썸머부스터 모집!</span>',
                    description: '단 3주, 맞춤형 영어 몰입 프로그램 <br>사전 등록하고 혜택받기 7/7(월) 마감',
                    link:'https://tyf30bc2.forms.app/elayc-2025s-booster-program-preregistration'
                },
                {
                    imageDesktop: 'https://placehold.co/1600x640/2ecc71/ffffff?text=Desktop+2',
                    imageMobile: 'https://placehold.co/540x540/2ecc71/ffffff?text=Mobile+2',
                    title: '영어 공부의 새로운 방향',
                    subtitle: '<span style="background: linear-gradient(90deg, #FF5950, #FFB66C); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">지금 바로 입학상담을 받아보세요</span>',
                    description: '감이 아닌 진단으로 출발하세요! <br>입학 상담과 SR테스트는 매주 토요일 진행됩니다 →',
                    link:'https://tr.ee/elayc-reservation-homepage'
                },
                {
                    imageDesktop: 'https://placehold.co/1600x640/9b59b6/ffffff?text=Desktop+3',
                    imageMobile: 'https://placehold.co/540x540/9b59b6/ffffff?text=Mobile+3',
                    title: '에픽은 뭐가 다를까?',
                    subtitle: '<span style="background: linear-gradient(90deg, #75FFE9, #83FFA4); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">에픽 정기 온라인 설명회</span>',
                    description: '읽기 중심 AI-SO모델을 통한 영어 습득의 모든 것 <Br>매주 토요일, 지금 바로 신청하세요 →',
                    link:'https://tr.ee/epic-yc-session-signup-hp-banner'
                },
                {
                    imageDesktop: 'https://placehold.co/1600x640/e74c3c/ffffff?text=Desktop+4',
                    imageMobile: 'https://placehold.co/540x540/e74c3c/ffffff?text=Mobile+4',
                    title: '우리 아이 영어 완성의 원픽',
                    subtitle: '<span style="background: linear-gradient(90deg, #FFA1B8, #C46AFF); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">파닉스 비기너 입학 모집 중!</span>',
                    description: '독립적으로 읽는 힘을 기르는 첫 단계, 에픽에서.<br>매주 토요일 입학 상담을 진행합니다 →',
                    link:'https://tr.ee/elayc-reservation-homepage'
                }
            ];
            const totalActualSlides = slideData.length;
            const autoplayDelay = 3000;
            const transitionStyle = 'transform 0.5s ease-out';
            const pauseIconHTML = '⏸';
            const playIconHTML = '▶';

            let currentIndex = 0;
            let isAutoplayPlaying = true;
            let autoplayInterval;
            let isTransitioning = false;
            let isDragging = false;
            let startPos = 0;
            let currentTranslate = 0;
            let prevTranslate = 0;

            function createSlide(data) {
                const slide = document.createElement('div');
                slide.className = 'slide';
                const imageUrl = window.innerWidth <= 1020 ? data.imageMobile : data.imageDesktop;
                slide.style.backgroundImage = `url('${imageUrl}')`;

                const linkStart = data.link ? `<a href="${data.link}" target="_blank" style="display:block; width:100%; height:100%; text-decoration:none;">` : '';
                const linkEnd = data.link ? '</a>' : '';

                slide.innerHTML = `${linkStart}<div class="text-content-block"><h3 class="slide-title" >${data.title}</h3><p class="slide-subtitle">${data.subtitle}</p><p class="slide-description">${data.description}</p></div>${linkEnd}`;
                return slide;
            }
            
            function initialize() {
                slidesContainer.innerHTML = '';
                slidesContainer.appendChild(createSlide(slideData[totalActualSlides - 1]));
                slideData.forEach(data => slidesContainer.appendChild(createSlide(data)));
                slidesContainer.appendChild(createSlide(slideData[0]));
                
                addEventListeners();
                slidesContainer.style.transition = 'none';
                positionToShow(1); 
                
                setTimeout(() => {
                    requestAnimationFrame(() => startAutoplay());
                }, 50);
            }
            
            function getSlideWidth() {
                const firstSlide = slidesContainer.querySelector('.slide');
                return firstSlide ? firstSlide.offsetWidth + 20 : 0; // 10px margin on each side
            }

            function getCenteringOffset() {
                const firstSlide = slidesContainer.querySelector('.slide');
                return firstSlide ? (viewport.offsetWidth - firstSlide.offsetWidth) / 2 : 0;
            }

            function positionToShow(index) {
                currentTranslate = -index * getSlideWidth() + getCenteringOffset();
                prevTranslate = currentTranslate;
                setSliderPosition();
                updateSlidePositionDisplay();
            }
            
            function setSliderPosition() { slidesContainer.style.transform = `translateX(${currentTranslate}px)`; }
            function updateSlidePositionDisplay() {
                const logicalIndex = ((currentIndex % totalActualSlides) + totalActualSlides) % totalActualSlides;
                positionText.textContent = `${logicalIndex + 1} / ${totalActualSlides}`;
                positionTextMobile.textContent = `${logicalIndex + 1} / ${totalActualSlides}`;
            }

            function nextSlide() { moveTo(++currentIndex + 1); }
            function prevSlide() { moveTo(--currentIndex + 1); }

            function moveTo(index) {
                if (isTransitioning) return;
                isTransitioning = true;
                slidesContainer.style.transition = transitionStyle;
                positionToShow(index);
            }
            
            function startAutoplay() {
                stopAutoplay();
                autoplayInterval = setInterval(nextSlide, autoplayDelay);
                isAutoplayPlaying = true;
                playPauseBtnDesktop.innerHTML = pauseIconHTML;
                playPauseBtnMobile.innerHTML = pauseIconHTML;
                [timelineIndicator, timelineIndicatorMobile].forEach(el => {
                    el.classList.remove('animate');
                    el.offsetHeight; 
                    el.classList.add('animate');
                });
            }

            function stopAutoplay() {
                clearInterval(autoplayInterval);
                isAutoplayPlaying = false;
                playPauseBtnDesktop.innerHTML = playIconHTML;
                playPauseBtnMobile.innerHTML = playIconHTML;
                 [timelineIndicator, timelineIndicatorMobile].forEach(el => el.classList.remove('animate'));
            }

            function toggleAutoplay() { isAutoplayPlaying ? stopAutoplay() : startAutoplay(); }
            
            function addEventListeners() {
                viewport.addEventListener('mousedown', dragStart);
                viewport.addEventListener('touchstart', dragStart, { passive: true });
                window.addEventListener('mouseup', dragEnd);
                window.addEventListener('touchend', dragEnd);
                window.addEventListener('mousemove', drag);
                window.addEventListener('touchmove', drag, { passive: true });
                slidesContainer.addEventListener('transitionend', handleTransitionEnd);
                playPauseBtnDesktop.addEventListener('click', toggleAutoplay);
                playPauseBtnMobile.addEventListener('click', toggleAutoplay);
                prevBtn.addEventListener('click', () => { stopAutoplay(); prevSlide(); });
                nextBtn.addEventListener('click', () => { stopAutoplay(); nextSlide(); });
                
                let previousIsMobile = window.innerWidth <= 1020;
                let resizeTimeout;
                window.addEventListener('resize', () => {
                  clearTimeout(resizeTimeout);
                  resizeTimeout = setTimeout(() => {
                    const isMobile = window.innerWidth <= 1020;
                    if (isMobile !== previousIsMobile) {
                        previousIsMobile = isMobile;
                        initialize(); // Reinitialize only if breakpoint crossed
                    } else {
                        slidesContainer.style.transition = 'none';
                        positionToShow(currentIndex + 1);
                    }
                  }, 250);
                });
            }

            function dragStart(event) {
                if (event.target.closest('a') || event.target.closest('.desktop-controls, .mobile-controls')) return;
                // event.preventDefault() might block the link click, so we only do it conditionally
                if (!event.target.closest('a')) {
                    event.preventDefault();
                }
                isDragging = true;
                startPos = event.type.includes('mouse') ? event.pageX : event.touches[0].clientX;
                slidesContainer.style.transition = 'none';
                viewport.classList.add('dragging');
                stopAutoplay();
            }

            function drag(event) {
                if (isDragging) {
                    const currentPosition = event.type.includes('mouse') ? event.pageX : event.touches[0].clientX;
                    currentTranslate = prevTranslate + currentPosition - startPos;
                    setSliderPosition();
                }
            }

            function dragEnd() {
                if (!isDragging) return;
                isDragging = false;
                viewport.classList.remove('dragging');
                const movedBy = currentTranslate - prevTranslate;
                if (movedBy < -50) { currentIndex++; } 
                else if (movedBy > 50) { currentIndex--; }
                moveTo(currentIndex + 1);
            }

            function handleTransitionEnd() {
                isTransitioning = false;
                let needsJump = false;
                if (currentIndex >= totalActualSlides) {
                    currentIndex = 0; needsJump = true;
                } else if (currentIndex < 0) {
                    currentIndex = totalActualSlides - 1; needsJump = true;
                }
                if (needsJump) {
                    slidesContainer.style.transition = 'none';
                    positionToShow(currentIndex + 1);
                }
                if(isAutoplayPlaying) { startAutoplay(); }
            }
            
            document.documentElement.style.setProperty('--anim-duration', `${autoplayDelay}ms`);
            initialize();
        });
    </script>
